user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 768;
	# multi_accept on;
}

http {
    

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 4096;

    # 请求体大小上限（文件上传），默认仅 1m，超过会被 nginx 直接 413 拒绝
    client_max_body_size 50m;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Gzip configuration
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_disable "msie6";

    include /etc/nginx/conf.d/*.conf;

    # saudi.damons.sa 域名 的 nginx 配置
    server {
        listen 443 ssl http2;

        server_name saudi.damons.sa;

        # 自签名证书
        ssl_certificate /etc/nginx/ssl/saudi.crt;
        ssl_certificate_key /etc/nginx/ssl/saudi.key;

        # 开启OCSP stapling
        ssl_stapling on;
        ssl_stapling_verify on;

        # 统一超时设置
        proxy_connect_timeout 600s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # overpage-React项目的构建产物目录
        root /etc/nginx/html/saudi;

        # /icons 路由 - 指向服务器 /icons 目录
        location /icons/ {
            alias /icons/;
            autoindex on;               # 可选：允许目录列表浏览
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        location /saudi-server/ {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Allow-Methods 'GET, POST, DELETE, OPTIONS';
                add_header Access-Control-Allow-Headers 'Content-Type, Authorization';
                add_header Access-Control-Max-Age 86400;
                return 204;
            }

            proxy_pass http://localhost:3000/saudi-server/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 配置React应用的前端路由支持
        location / {
            index       index.html;
            try_files $uri $uri $uri.html $uri/ /index.html;
        }
    }

    server {
        listen 80;
        server_name saudi.damons.sa;
        return 301 https://$server_name$request_uri;
    }

    # damons-home.damons.sa 域名 的 nginx 配置
    server {
        listen 443 ssl http2;

        server_name damons-home.damons.sa;

        # 自签名证书
        ssl_certificate /etc/nginx/ssl/saudi.crt;
        ssl_certificate_key /etc/nginx/ssl/saudi.key;

        # 统一超时设置
        proxy_connect_timeout 600s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # 构建产物目录
        # 旧 Vite 静态目录 /etc/nginx/html/damonshome 已不再使用（保留在服务器上便于回滚）

        # 后端接口：保持不变，浏览器相对路径请求仍由 nginx 转发
        location /damonshome-server/ {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Allow-Methods 'GET, POST, DELETE, OPTIONS';
                add_header Access-Control-Allow-Headers 'Content-Type, Authorization';
                add_header Access-Control-Max-Age 86400;
                return 204;
            }

            proxy_pass http://localhost:3001/damonshome-server/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 发邮件接口代理到 saudi-server（端口 3000），与 saudi.damons.sa 共用同一个邮件服务
        # 前端生产构建发相对路径 /saudi-server/...（src/utils/log.js 的 sendMail）
        location /saudi-server/ {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Allow-Methods 'GET, POST, DELETE, OPTIONS';
                add_header Access-Control-Allow-Headers 'Content-Type, Authorization';
                add_header Access-Control-Max-Age 86400;
                return 204;
            }

            proxy_pass http://localhost:3000/saudi-server/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # /damonshome 路由 - 指向服务器 /damonshome 目录（存放上传的图片）
        location /damonshome/ {
            alias /damonshome/;
            expires 30d;
            add_header Cache-Control "public";
            add_header Access-Control-Allow-Origin *;
        }

        # Next.js standalone 服务（/opt/damons-home，node server.js，端口 5173）
        # 页面 SSR、/_next 静态资源、前端路由全部反向代理给 Next 服务
        location / {
            proxy_pass http://127.0.0.1:5173;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # 告知 Next 原始协议为 https，避免其生成 http 绝对地址
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 80;
        server_name damons-home.damons.sa;
        return 301 https://$server_name$request_uri;
    }
}

